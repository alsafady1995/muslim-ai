name: Deploy backend
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply database migrations
        run: supabase db push --remote --yes
      - name: Deploy edge functions
        run: |
          for fn in ask-quran assistant quran-search recitation-analyze delete-account; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --yes
          done
          supabase functions deploy revenuecat-webhook --no-verify-jwt --project-ref "$PROJECT_REF" --yes
