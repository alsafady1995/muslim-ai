name: Release mobile
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.35.7", channel: stable, cache: true }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: app }
      - name: Write build config and keystore
        run: |
          echo '${{ secrets.APP_ENV_PROD_JSON }}' > env/prod.json
          echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 -d > android/upload.jks
          echo '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > android/play-service-account.json
      - name: Build app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/android/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --dart-define-from-file=env/prod.json --build-number=${{ github.run_number }}
      - name: Upload to Play internal testing
        run: cd android && bundle exec fastlane internal

  ios:
    runs-on: macos-15
    environment: production
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.35.7", channel: stable, cache: true }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: app }
      - run: echo '${{ secrets.APP_ENV_PROD_JSON }}' > env/prod.json
      - name: Register the Google Sign-In URL scheme (reversed iOS client id)
        # google_sign_in on iOS aborts the app if this URL scheme is missing from Info.plist.
        run: |
          CID=$(jq -r '.GOOGLE_IOS_CLIENT_ID // empty' env/prod.json)
          if [ -z "$CID" ]; then echo "::error::GOOGLE_IOS_CLIENT_ID missing from APP_ENV_PROD_JSON"; exit 1; fi
          REV=$(echo "$CID" | awk -F. '{for (i = NF; i > 0; i--) printf "%s%s", $i, (i > 1 ? "." : "")}')
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" \
            -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" \
            -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string $REV" ios/Runner/Info.plist
      - run: flutter build ios --release --no-codesign --dart-define-from-file=env/prod.json --build-number=${{ github.run_number }}
      - name: Sign and upload to TestFlight
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cd ios && bundle exec fastlane beta
