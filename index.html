<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="/muslim-ai/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Asmi3ni web preview (demo mode: AI and payments are simulated).">

  <!-- iOS: "Add to Home Screen" opens full screen like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Asmi3ni">
  <meta name="theme-color" content="#0E7C66">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Asmi3ni</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The page itself never scrolls: Flutter draws the whole app in one full-screen view.
       The loader is a full-screen overlay (not in the page flow) and is removed as soon
       as Flutter shows its first frame. */
    html, body { margin: 0; padding: 0; overflow: hidden; background: #F4FAF7; }
    #loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;
      z-index: 2147483647; background: #0E7C66; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; direction: rtl;
      font-family: -apple-system, system-ui, sans-serif; gap: 14px; }
    #loading .spin { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.35);
      border-top-color: #fff; border-radius: 50%; animation: s 0.9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="spin"></div><div>أسمِعني · جارٍ التحميل…</div></div>
  <script>
    (function () {
      function hide() { var el = document.getElementById('loading'); if (el) el.remove(); }
      window.addEventListener('flutter-first-frame', hide);
      // Fallback for browsers where the first-frame event is missed: hide once the
      // Flutter view is attached, and never keep the loader up longer than 20 s.
      new MutationObserver(function (_, obs) {
        if (document.querySelector('flutter-view, flt-glass-pane')) { setTimeout(hide, 1500); obs.disconnect(); }
      }).observe(document.body, { childList: true, subtree: true });
      setTimeout(hide, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
