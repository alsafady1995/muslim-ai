# Supabase CLI config (local dev: `supabase start`). Production settings live in the dashboard.
project_id = "muslim-ai"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "muslimai://auth-callback"
additional_redirect_urls = ["muslimai://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_anonymous_sign_ins = true
enable_manual_linking = true

[auth.email]
enabled = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.external.apple]
enabled = true
client_id = "env(APPLE_SERVICES_ID)"
secret = "env(APPLE_CLIENT_SECRET)"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_WEB_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[functions.ask-quran]
verify_jwt = true
[functions.assistant]
verify_jwt = true
[functions.quran-search]
verify_jwt = true
[functions.recitation-analyze]
verify_jwt = true
[functions.delete-account]
verify_jwt = true
[functions.revenuecat-webhook]
verify_jwt = false
